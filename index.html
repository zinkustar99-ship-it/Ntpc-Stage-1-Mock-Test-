function draw(){if(ended)return;let q=qs[cur];el("section").textContent=q.s+" · ";el("counter").textContent="प्रश्न "+(cur+1)+" / 50";el("question").textContent=q.q;el("options").innerHTML=q.o.map((v,i)=>'<label class="opt"><input type="radio" name="answer" '+(ans[cur]===i?"checked":"")+' value="'+i+'">'+String.fromCharCode(65+i)+'. '+v+'</label>').join("");document.querySelectorAll('input[name=answer]').forEach(r=>r.onchange=()=>{ans[cur]=+r.value;draw()});let f=el("feedback");if(ans[cur]!==null){let ok=ans[cur]===q.a;f.className=ok?"good":"bad";f.innerHTML=(ok?"✓ सही उत्तर":"✗ गलत। सही उत्तर: "+q.o[q.a])+"<br>"+q.e}else{f.className="";f.textContent=""}el("prev").disabled=cur===0;el("next").disabled=cur===49;el("mark").textContent=mark[cur]?"⚑ Review हटाएँ":"⚑ Review";let n=ans.filter(x=>x!==null).length;el("progress").style.width=n*2+"%";el("progressText").textContent=n+" / 50 उत्तर दिए गए";el("grid").innerHTML=qs.map((_,i)=>'<button class="num '+(ans[i]!==null?"done ":"")+(mark[i]?"mark ":"")+(i===cur?"sel":"")+'" data-i="'+i+'">'+(i+1)+'</button>').join("");document.querySelectorAll(".num").forEach(b=>b.onclick=()=>{cur=+b.dataset.i;draw()})}
el("prev").onclick=()=>{cur--;draw()};el("next").onclick=()=>{cur++;draw()};el("mark").onclick=()=>{mark[cur]=!mark[cur];draw()};el("clear").onclick=()=>{ans[cur]=null;draw()};el("submit").onclick=()=>finish(false);
function finish(auto){if(ended)return;if(!auto&&!confirm("क्या आप टेस्ट जमा करना चाहते हैं?"))return;ended=true;clearInterval(clock);let c=0,w=0;qs.forEach((q,i)=>{if(ans[i]===q.a)c++;else if(ans[i]!==null)w++});let blank=50-c-w,score=c-w/3;el("layout").innerHTML='<section class="card" style="grid-column:1/-1"><h2>आपका परिणाम</h2><div class="score">'+score.toFixed(2)+' / 50</div><p>सही: '+c+' · गलत: '+w+' · अनुत्तरित: '+blank+'</p><p>नकारात्मक अंकन: प्रत्येक गलत उत्तर पर ⅓ अंक घटे।</p><button class="btn primary" onclick="location.reload()">दोबारा टेस्ट दें</button><h3>उत्तर और व्याख्या</h3>'+qs.map((q,i)=>'<div class="review"><b>'+(i+1)+'. '+q.q+'</b><p>'+(ans[i]===null?"अनुत्तरित":ans[i]===q.a?"सही उत्तर":"गलत उत्तर")+' · सही विकल्प: '+q.o[q.a]+'</p><small>'+q.e+'</small></div>').join("")+'</section>';el("timer").textContent="समाप्त"}
const clock=setInterval(()=>{if(ended)return;sec--;el("timer").textContent=String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0");if(sec<=0)finish(true)},1000);draw();
